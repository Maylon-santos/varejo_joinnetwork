log_format varejo_admin '$remote_addr $request_method $status $request_time $body_bytes_sent';
server {
    listen 80;
    server_name aeropostale.joinnetwork.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://aeropostale.joinnetwork.com.br$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name aeropostale.joinnetwork.com.br;
    ssl_certificate /etc/letsencrypt/live/aeropostale.joinnetwork.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aeropostale.joinnetwork.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 8k;
    access_log /var/log/nginx/aeropostale-varejo.access.log;
    error_log /var/log/nginx/aeropostale-varejo.error.log;
    # Console do tenant: dados exigem conta autorizada e MFA na aplicação.
    # O domínio da documentação pública continua sem rotas administrativas.
    location ~ ^/admin/integracoes/(console(?:\.js|\.css)?|qrcode\.mjs|login|logout|cadastro-confirmar|step-up|manual|clientes(?:/.*)?|acessos|auditoria|entregas|metricas|webhooks)$ {
        client_max_body_size 64k;
        access_log /var/log/nginx/aeropostale-integracoes-admin.access.log varejo_admin;
        error_log /var/log/nginx/aeropostale-integracoes-admin.error.log crit;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 10s;
    }
    location ~ ^/api/v1/funcionarios/[0-9]+/[^/]+/foto$ {
        client_max_body_size 3m;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
