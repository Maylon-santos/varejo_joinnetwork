# Instalar como vhost adicional, depois de DNS/certificado. Não substituir nginx.conf do painel.
# Dentro do contexto http, antes dos blocos server:
log_format varejo_integracoes '$remote_addr $request_method $status $request_time $body_bytes_sent';
server {
    listen 80;
    server_name api-varejo.aeropostale.joinnetwork.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://api-varejo.aeropostale.joinnetwork.com.br$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name api-varejo.aeropostale.joinnetwork.com.br;
    ssl_certificate /etc/letsencrypt/live/api-varejo.aeropostale.joinnetwork.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-varejo.aeropostale.joinnetwork.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64k;
    # Não gravar query, URI, token, JWT ou payload nos logs do proxy.
    access_log /var/log/nginx/varejo-integracoes.access.log varejo_integracoes;
    error_log /var/log/nginx/varejo-integracoes.error.log crit;
    location ~ ^/(oauth/token|v1/(vendas|filiais|produtos|estoques|alteracoes|webhooks)(/.*)?)$ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 10s;
    }
    location / { return 404; }
}
