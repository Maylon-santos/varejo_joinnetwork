# Incluído pelo wrapper somente quando .env.notificacoes privado estiver presente.
services:
  api:
    environment:
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_ENCRYPTION_KEY: ${WEB_PUSH_ENCRYPTION_KEY:-}
      WEB_PUSH_PILOT_USERS: ${WEB_PUSH_PILOT_USERS:-}
  notificacoes-worker:
    image: aeropostale-varejo-api:pwa-20261123
    command: [node, scripts/notificacoes-worker.mjs]
    restart: unless-stopped
    init: true
    cpus: 0.25
    mem_limit: 192m
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=8m,mode=1777]
    environment:
      NODE_ENV: production
      TZ: America/Sao_Paulo
      TENANT_KEY: ${TENANT_KEY:?Configure TENANT_KEY}
      WEB_PUSH_ENABLED: ${WEB_PUSH_ENABLED:-false}
      WEB_PUSH_WORKER_ENABLED: ${WEB_PUSH_WORKER_ENABLED:-false}
      WEB_PUSH_PUBLIC_KEY: ${WEB_PUSH_PUBLIC_KEY:-}
      WEB_PUSH_PRIVATE_KEY: ${WEB_PUSH_PRIVATE_KEY:-}
      WEB_PUSH_ENCRYPTION_KEY: ${WEB_PUSH_ENCRYPTION_KEY:-}
      WEB_PUSH_SUBJECT: ${WEB_PUSH_SUBJECT:-https://aeropostale.joinnetwork.com.br}
      WEB_PUSH_PILOT_USERS: ${WEB_PUSH_PILOT_USERS:-}
      PUSH_CONTROL_DATABASE_URL: ${PUSH_CONTROL_DATABASE_URL:-}
      PUSH_TENANT_DATABASE_URL: ${PUSH_TENANT_DATABASE_URL:-}
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');try{process.exit(Date.now()-Number(fs.readFileSync('/tmp/notificacoes-heartbeat','utf8'))<240000?0:1)}catch{process.exit(1)}"]
      interval: 60s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
