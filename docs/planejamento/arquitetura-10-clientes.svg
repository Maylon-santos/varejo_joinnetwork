<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 490" role="img" aria-labelledby="diagram-title diagram-desc"><title id="diagram-title">Uma plataforma, dez clientes, dez bancos separados</title><desc id="diagram-desc">Usuários acessam o portal. A API consulta o cadastro central, valida a empresa e as permissões e encaminha cada consulta ao banco exclusivo do cliente.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#6d8e9b"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle"><rect width="1080" height="490" rx="20" fill="#f2f6f6"/><g fill="none" stroke="#6d8e9b" stroke-width="2" marker-end="url(#arrow)"><path d="M250 92H329"/><path d="M591 92H670"/><path d="M805 140V204"/><path d="M540 250V280"/></g><path d="M120 306V280H984V306M336 280V306M552 280V306M768 280V306M14 280H984" fill="none" stroke="#6d8e9b" stroke-width="2"/><rect x="30" y="44" width="220" height="96" rx="14" fill="white" stroke="#d4e0e3"/><text x="140" y="84" font-size="18" fill="#102f3d">Pessoas e lojas</text><text x="140" y="110" font-size="13" fill="#536b75">Computador · celular</text><rect x="330" y="44" width="260" height="96" rx="14" fill="#113b4b"/><text x="460" y="84" font-size="20" fill="white">Portal Join Network</text><text x="460" y="110" font-size="13" fill="#b6d7de">Um login · uma plataforma</text><rect x="670" y="44" width="270" height="96" rx="14" fill="white" stroke="#d4e0e3"/><text x="805" y="84" font-size="18" fill="#102f3d">Cadastro central</text><text x="805" y="110" font-size="13" fill="#536b75">Empresas · usuários · acessos</text><rect x="190" y="204" width="700" height="46" rx="12" fill="#d8efea" stroke="#91cbbd"/><text x="540" y="233" font-size="16" fill="#145b4c">API: identifica a empresa e verifica cada permissão</text><g fill="none" stroke="#6d8e9b" stroke-width="1.5" marker-end="url(#arrow)"><path d="M14 280V422H24"/><path d="M230 280V