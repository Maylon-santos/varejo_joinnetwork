name: Validar aplicação e API externa
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: senha-apenas-do-postgres-efemero-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONTROL_DATABASE_URL: postgresql://postgres:senha-apenas-do-postgres-efemero-ci@127.0.0.1:5432/varejo_control
      TENANT_DATABASE_URL: postgresql://postgres:senha-apenas-do-postgres-efemero-ci@127.0.0.1:5432/varejo_teste
      SYNC_ENABLED: "false"
      INTEGRATIONS_ENABLED: "false"
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Criar bancos descartáveis
        env:
          PGPASSWORD: senha-apenas-do-postgres-efemero-ci
        run: |
          createdb -h 127.0.0.1 -U postgres varejo_control
          createdb -h 127.0.0.1 -U postgres varejo_teste
      - run: npm test
      - run: node --test backend/tests/integration/*.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verificar-integracoes-ui.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/integracoes/exemplos/requirements-validacao.txt
      - run: python scripts/validar-docs-integracoes.py
      - run: python scripts/validar-respostas-integracoes.py
      # Publicação continua operacional via SSH. Este workflow não possui credenciais de produção.
